version: 2

# Dependabot: alertas e security updates sao ligados na configuracao do repositorio
# (Settings > Code security). Este arquivo governa as ATUALIZACOES DE VERSAO.
# Atualizacoes de seguranca ignoram o cooldown por natureza.
# Renovate (renovate.json) continua como configuracao primaria quando ativo.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - deps
      - dependabot
      - security
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Security-sensitive: pinned and reviewed manually.
      # Renovate handles these with Security Lead approval.
      - dependency-name: "better-sqlite3"
      - dependency-name: "jsonwebtoken"
      - dependency-name: "jose"
      - dependency-name: "tree-sitter"
      - dependency-name: "tree-sitter-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - deps
      - dependabot
      - github-actions
    commit-message:
      prefix: chore(ci)
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
