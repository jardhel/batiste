name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: lint + typecheck + test + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # github/codeql-action/upload-sarif posts the security-only ESLint findings to Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node 24 (gates importam .ts direto; exige Node >= 22.18)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Lint completo (strictTypeChecked): qualidade/estilo, relatório no artefato ci-reports.
      # NÃO vai ao Code Scanning: eram ~650 alertas de estilo no painel de segurança.
      - name: Lint (relatório de qualidade)
        run: |
          mkdir -p reports
          pnpm exec eslint . \
            --format @microsoft/eslint-formatter-sarif \
            --output-file reports/eslint-quality.sarif || true

      # Só regras de SEGURANÇA (eslint.security.config.js) sobem ao Code Scanning, e esta
      # etapa FALHA o build se achar algo. Um upload sem resultados fecha os alertas antigos
      # da category "eslint". Ver docs/SECURITY-CODE-SCANNING-TRIAGE.md.
      - name: Lint de segurança (ESLint → SARIF)
        run: |
          mkdir -p reports
          pnpm exec eslint -c eslint.security.config.js . \
            --format @microsoft/eslint-formatter-sarif \
            --output-file reports/eslint.sarif

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test (vitest with v8 coverage)
        run: pnpm -r test -- --coverage

      # task-sync (Task-done trailer reconcile + stale-check) gate.
      #
      # The *intended* gate is `reconcile --check`: fail if any task is
      # "completed-by-commit" (has a Task-done trailer in the merged commits)
      # yet still `pending` on the board. That gate is honest only against a
      # real board — but a fresh CI checkout has NO `$PROJECT_ROOT/.batiste/
      # tasks.db`, so `--check` here would have nothing to compare and would
      # either no-op (false green) or error on a missing DB. We do NOT ship a
      # gate that can't actually run in CI.
      #
      # So in CI we verify the reconcile/stale-check *logic* via its unit
      # tests instead (real git fixtures + in-memory SQLite, no live DB
      # needed). The live `reconcile --check` gate runs locally / in the
      # post-merge hook where a real tasks.db exists. `|| true` keeps the
      # filter from failing the build if the test name pattern matches
      # nothing yet (e.g. before Agent A's reconcile lands).
      - name: task-sync reconcile tests (logic gate)
        run: pnpm -r test -- --run -t "reconcile|task-sync|stale" || true

      - name: Knip (dead-code scan)
        run: pnpm exec knip --reporter json --no-exit-code > reports/knip.json || true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: reports/eslint.sarif
          category: eslint

      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-reports
          path: |
            reports/
            packages/*/coverage/
          retention-days: 30

  license-gate:
    name: license gate + NOTICE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: License report
        run: node scripts/generate-license-report.mjs --strict
      - name: NOTICE aggregation
        run: node scripts/generate-notice.mjs --verify
      - name: Upload license artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-report
          path: |
            reports/licenses.json
            reports/licenses.html
            NOTICE
          retention-days: 90

  # Gate de supply chain: falha o build com qualquer vulnerabilidade >= high em
  # dependencias de producao. Job proprio para aparecer como status check separado.
  dependency-audit:
    name: pnpm audit (prod, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: pnpm audit --prod --audit-level=high
        run: pnpm audit --prod --audit-level=high
