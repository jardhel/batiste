name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-publish:
    name: build · sbom · sign · publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # criar o GitHub Release
      id-token: write       # sigstore keyless signing + attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag matches CHANGELOG
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${TAG_VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing entry for ${TAG_VERSION}"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test (release gate)
        run: pnpm -r test

      - name: Generate SBOM (SPDX + CycloneDX)
        run: bash scripts/generate-sbom.sh

      # SPDX 2.3 nativo do GitHub (dependency graph): sem instalar ferramenta nao
      # vetada. Sobrescreve o SPDX do script, que sem syft cai em docker
      # anchore/syft:latest ou num stub minimo.
      - name: SPDX SBOM from GitHub dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --jq .sbom > reports/sbom.spdx.json
          node -e "const s=JSON.parse(require('fs').readFileSync('reports/sbom.spdx.json','utf8'));if(!s.spdxVersion||!(s.packages||[]).length)process.exit(1);console.log(s.spdxVersion,s.packages.length,'packages')"
          (cd reports && sha256sum sbom.spdx.json sbom.cdx.json > sbom.sha256)

      - name: Generate license report + NOTICE
        run: |
          node scripts/generate-license-report.mjs --strict
          node scripts/generate-notice.mjs --write

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign SBOMs (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature reports/sbom.spdx.json.sig \
            --output-certificate reports/sbom.spdx.json.pem \
            reports/sbom.spdx.json
          cosign sign-blob --yes \
            --output-signature reports/sbom.cdx.json.sig \
            --output-certificate reports/sbom.cdx.json.pem \
            reports/sbom.cdx.json

      - name: Pack release tarball
        id: pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="batiste-${VERSION}.tar.gz"
          # escreve FORA da árvore que está sendo tarball-izada — escrever dentro
          # faz o tar ler o próprio output ("file changed as we read it", exit 1)
          tar --exclude='./node_modules' --exclude='./.git' \
              -czf "${RUNNER_TEMP}/${TARBALL}" .
          mv "${RUNNER_TEMP}/${TARBALL}" "${TARBALL}"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Sign tarball (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature ${{ steps.pack.outputs.tarball }}.sig \
            --output-certificate ${{ steps.pack.outputs.tarball }}.pem \
            ${{ steps.pack.outputs.tarball }}

      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sha256
            ${{ steps.pack.outputs.tarball }}.sig
            ${{ steps.pack.outputs.tarball }}.pem
            reports/sbom.spdx.json
            reports/sbom.spdx.json.sig
            reports/sbom.spdx.json.pem
            reports/sbom.cdx.json
            reports/sbom.cdx.json.sig
            reports/sbom.cdx.json.pem
            reports/licenses.json
            reports/licenses.html
            NOTICE
