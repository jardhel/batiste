name: OSV-Scanner

on:
  schedule:
    - cron: "23 3 * * *"  # diario 03:23 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [pnpm-lock.yaml]

permissions:
  contents: read

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: osv-scanner (pnpm-lock.yaml)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
      fail-on-vuln: true
