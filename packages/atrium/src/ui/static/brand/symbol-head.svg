<?xml version="1.0" encoding="UTF-8"?>
<!-- Cachola Tech · Primary symbol (brain constellation)
     Six nodes + center · the six GVS axes (Identity · Policy · Roles ·
     Decision · Memory · Audit) orchestrated at a single integration point.
     The visual is the brain abstracted — point network, no facial figure —
     consistent with the Medium hero ornament and institutional landing diagram.
     Use: favicon (large), avatar, document cover, slide mark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cachola Tech">
  <defs>
    <style>
      .edge{fill:none;stroke:#1F2B3D;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
      .spoke{fill:none;stroke:#1F2B3D;stroke-width:1.0;stroke-linecap:round}
      .node{fill:#1F2B3D}
      .hub{fill:#FFFFFF;stroke:#1F2B3D;stroke-width:1.4}
    </style>
  </defs>

  <g transform="translate(100,100)">
    <!-- Hex outer edges -->
    <g class="edge">
      <line x1="0"   y1="-70" x2="60"  y2="-35"/>
      <line x1="60"  y1="-35" x2="60"  y2="35"/>
      <line x1="60"  y1="35"  x2="0"   y2="70"/>
      <line x1="0"   y1="70"  x2="-60" y2="35"/>
      <line x1="-60" y1="35"  x2="-60" y2="-35"/>
      <line x1="-60" y1="-35" x2="0"   y2="-70"/>
    </g>
    <!-- Spokes to center -->
    <g class="spoke">
      <line x1="0"   y1="-70" x2="0" y2="0"/>
      <line x1="60"  y1="-35" x2="0" y2="0"/>
      <line x1="60"  y1="35"  x2="0" y2="0"/>
      <line x1="0"   y1="70"  x2="0" y2="0"/>
      <line x1="-60" y1="35"  x2="0" y2="0"/>
      <line x1="-60" y1="-35" x2="0" y2="0"/>
    </g>
    <!-- Axis nodes (the six) -->
    <g class="node">
      <circle cx="0"   cy="-70" r="5"/>
      <circle cx="60"  cy="-35" r="5"/>
      <circle cx="60"  cy="35"  r="5"/>
      <circle cx="0"   cy="70"  r="5"/>
      <circle cx="-60" cy="35"  r="5"/>
      <circle cx="-60" cy="-35" r="5"/>
    </g>
    <!-- Integration hub (center) — hollow, signals orchestration -->
    <circle cx="0" cy="0" r="5" class="hub"/>
  </g>
</svg>
