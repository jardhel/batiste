<?xml version="1.0" encoding="UTF-8"?>
<!-- Cachola Tech · Stacked lockup v3 — brain-constellation above wordmark -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Cachola Tech">
  <defs>
    <style>
      .edge{fill:none;stroke:#1F2B3D;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .spoke{fill:none;stroke:#1F2B3D;stroke-width:1.0;stroke-linecap:round}
      .node{fill:#1F2B3D}
      .hub{fill:#FFFFFF;stroke:#1F2B3D;stroke-width:1.5}
      .wordmark{font-family:"EB Garamond","Libertinus Serif","Times New Roman",serif;font-size:52px;fill:#1F2B3D;font-style:italic;letter-spacing:-0.01em}
      .tag{font-family:"Inter","Helvetica Neue",sans-serif;font-size:10px;fill:#5A6472;letter-spacing:0.46em;text-transform:uppercase}
      .rule{stroke:#1F2B3D;stroke-width:0.5}
      .dot{fill:#1F2B3D}
    </style>
  </defs>

  <!-- Constellation, centered top -->
  <g transform="translate(200,150)">
    <g class="edge">
      <line x1="0"   y1="-90" x2="78"  y2="-45"/>
      <line x1="78"  y1="-45" x2="78"  y2="45"/>
      <line x1="78"  y1="45"  x2="0"   y2="90"/>
      <line x1="0"   y1="90"  x2="-78" y2="45"/>
      <line x1="-78" y1="45"  x2="-78" y2="-45"/>
      <line x1="-78" y1="-45" x2="0"   y2="-90"/>
    </g>
    <g class="spoke">
      <line x1="0"   y1="-90" x2="0" y2="0"/>
      <line x1="78"  y1="-45" x2="0" y2="0"/>
      <line x1="78"  y1="45"  x2="0" y2="0"/>
      <line x1="0"   y1="90"  x2="0" y2="0"/>
      <line x1="-78" y1="45"  x2="0" y2="0"/>
      <line x1="-78" y1="-45" x2="0" y2="0"/>
    </g>
    <g class="node">
      <circle cx="0"   cy="-90" r="6"/>
      <circle cx="78"  cy="-45" r="6"/>
      <circle cx="78"  cy="45"  r="6"/>
      <circle cx="0"   cy="90"  r="6"/>
      <circle cx="-78" cy="45"  r="6"/>
      <circle cx="-78" cy="-45" r="6"/>
    </g>
    <circle cx="0" cy="0" r="6" class="hub"/>
  </g>

  <line class="rule" x1="140" y1="300" x2="260" y2="300"/>

  <text class="wordmark" x="200" y="352" text-anchor="middle">
    <tspan>cachola</tspan>
    <tspan dx="6">·</tspan>
    <tspan dx="4">tech</tspan>
  </text>
  <text class="tag" x="200" y="382" text-anchor="middle">Eindhoven · MMXXVI</text>
</svg>
