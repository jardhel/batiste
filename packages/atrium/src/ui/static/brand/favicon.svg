<?xml version="1.0" encoding="UTF-8"?>
<!-- Cachola Tech · Favicon (32×32)
     Simplified constellation — six outer nodes, no spokes, no center,
     no hex lines. Legible at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#1F2B3D"/>
  <g transform="translate(16,16)" fill="#FAF6ED">
    <circle cx="0"   cy="-8" r="1.6"/>
    <circle cx="7"   cy="-4" r="1.6"/>
    <circle cx="7"   cy="4"  r="1.6"/>
    <circle cx="0"   cy="8"  r="1.6"/>
    <circle cx="-7"  cy="4"  r="1.6"/>
    <circle cx="-7"  cy="-4" r="1.6"/>
    <circle cx="0"   cy="0"  r="1.2" fill="none" stroke="#FAF6ED" stroke-width="0.8"/>
  </g>
</svg>
